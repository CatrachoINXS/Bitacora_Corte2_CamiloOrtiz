server:
  port: 8080

spring:
  application:
    name: sakura-sushi
  datasource:
    url: jdbc:postgresql://localhost:5432/restaurante
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: update   # crea/actualiza tablas automáticamente
    show-sql: true       # muestra las queries en consola — útil en desarrollo
    properties:
      hibernate:
        format_sql: true
  mongodb:
    uri: mongodb://localhost:27017/restaurante